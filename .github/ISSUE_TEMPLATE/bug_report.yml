name: Bug report
description: Something in Awesome Dashboard is broken or looks wrong.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Write in English or Vietnamese — either is fine.

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what you got instead. For anything visual, a screenshot says more than a paragraph.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the deck list
        2. Click ...
        3. ...
    validations:
      required: true

  - type: input
    id: addon-version
    attributes:
      label: Add-on version
      description: Tools → Add-ons → Awesome Dashboard.
      placeholder: "1.5.0"
    validations:
      required: true

  - type: input
    id: anki-version
    attributes:
      label: Anki version and operating system
      description: Help → About → Copy Debug Info.
      placeholder: "25.02.7, macOS 14.6"
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Error message
      description: Anki shows add-on errors in a red box. Paste the whole thing if you got one.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Before filing
      options:
        - label: I am on the latest version of the add-on.
        - label: It still happens with every other add-on disabled.
